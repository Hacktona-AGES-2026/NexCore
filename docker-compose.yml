name: nexcore

services:
  backend:
    build: ./backend
    environment:
      APP_AMBIENTE: producao
      SECRET_KEY: ${SECRET_KEY:-troque-esta-chave}
      REFERENCE_DATE: "2026-10-23"
      HOSPITAL_ID: ${HOSPITAL_ID:-hsl}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      NECO_IA_RPM: ${NECO_IA_RPM:-10}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_USE_MOCK: "false"
        VITE_API_URL: /v1
        VITE_WS_URL: /v1/ws
        VITE_HOSPITAL_ID: ${HOSPITAL_ID:-hsl}
    environment:
      BACKEND_UPSTREAM: backend:5000
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nexcore.rule=Host(`nexcorehealth.com.br`)"
      - "traefik.http.services.nexcore.loadbalancer.server.port=80"
      - "traefik.http.routers.nexcore.entrypoints=websecure"
      - "traefik.http.routers.nexcore.tls=true"
      - "traefik.http.routers.nexcore.tls.certresolver=letsencrypt"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  simulador:
    build: ./simulador
    environment:
      BACKEND_URL: http://backend:5000
      HOSPITAL_ID: ${HOSPITAL_ID:-hsl}
      REFERENCE_DATE: "2026-10-23"
      ENTRY_INTERVAL: ${ENTRY_INTERVAL:-10s}
      EVENT_INTERVAL: ${EVENT_INTERVAL:-5s}
      SIM_SEED: ${SIM_SEED:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
