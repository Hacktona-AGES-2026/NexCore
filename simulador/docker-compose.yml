name: nexcore-simulador

services:
  simulador:
    build: .
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:5000}
      HOSPITAL_ID: ${HOSPITAL_ID:-hsl}
      REFERENCE_DATE: "2026-10-23"
      ENTRY_INTERVAL: ${ENTRY_INTERVAL:-10s}
      EVENT_INTERVAL: ${EVENT_INTERVAL:-5s}
      SIM_SEED: ${SIM_SEED:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
